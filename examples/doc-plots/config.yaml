source:
  host: hambach
  path: /projects/bennch-data/bennch-datadump/
vars:
  local_spike_counter:
    path: 0*_bench/work/stdout
    parser: grep -i local_spike_counter | cut -f2
    cast: int
  PIPELINE_ID:
    path: 0*_bench/work/metadata/env-vars.out
    parser: grep -i CI_PIPELINE_ID= | cut -d= -f2
    cast: int
  PARENT_PIPELINE_ID:
    path: 0*_bench/work/metadata/env-vars.out
    parser: grep -i CI_UPSTREAM_PIPELINE_ID= | cut -d= -f2
    cast: int
  GATHER_METADATA_VERS:
    path: 0*_bench/work/metadata/gather.json
    parser: jq .version
    cast: str
  times:
    path: 0*_bench/work/data/logfile_0
    parser: grep -i time_
    cast: str
  py_time_connect:
    path: 0*_bench/work/data/logfile_0
    parser: awk '/^py_time_connect[[:space:]]/ {print $2; exit}'
    cast: float
  py_time_create:
    path: 0*_bench/work/data/logfile_0
    parser: awk '/^py_time_create[[:space:]]/ {print $2; exit}'
    cast: float
  time_update:
    path: 0*_bench/work/data/logfile_0
    parser: awk '/^time_update[[:space:]]/ {print $2; exit}'
    cast: float
  model_time_sim:
    path: configuration.xml
    parser: grep '<parameter name="model_time_sim"' | sed -n
      's/.*>\([^<]*\)<.*/\1/p'
    cast: float
  time_collocate_spike_data:
    path: 0*_bench/work/data/logfile_0
    parser: awk '/^time_collocate_spike_data[[:space:]]/ {print $2; exit}'
    cast: float
  time_communicate_spike_data:
    path: 0*_bench/work/data/logfile_0
    parser: awk '/^time_communicate_spike_data[[:space:]]/ {print $2; exit}'
    cast: float
  time_deliver_spike_data:
    path: 0*_bench/work/data/logfile_0
    parser: awk '/^time_deliver_spike_data[[:space:]]/ {print $2; exit}'
    cast: float
  time_mpi_synchronization:
    path: 0*_bench/work/data/logfile_0
    parser: awk '/^time_mpi_synchronization[[:space:]]/ {print $2; exit}'
    cast: float
  threads_per_task:
    path: 0*_bench/work/data/logfile_0
    parser: grep "^local_num_threads " | cut -f2 -d" "
    cast: int
  base_memory:
    path: 0*_bench/work/data/logfile_0
    parser: grep "^base_memory " | cut -f2 -d" "
    cast: int
  num_processes:
    path: 0*_bench/work/data/logfile_0
    parser: grep "^num_processes " | cut -f2 -d" "
    cast: int
  local_num_threads:
    path: 0*_bench/work/data/logfile_0
    parser: grep "^local_num_threads " | cut -f2 -d" "
    cast: int
  node_memory:
    path: 0*_bench/work/data/logfile_0
    parser: grep "^node_memory " | cut -f2 -d" "
    cast: int
  network_memory:
    path: 0*_bench/work/data/logfile_0
    parser: grep "^network_memory " | cut -f2 -d" "
    cast: int
  init_memory:
    path: 0*_bench/work/data/logfile_0
    parser: grep "^init_memory " | cut -f2 -d" "
    cast: int
  total_memory:
    path: 0*_bench/work/data/logfile_0
    parser: grep "^total_memory " | cut -f2 -d" "
    cast: int
  time_omp_synchronization_simulation:
    path: 0*_bench/work/data/logfile_0
    parser: awk '/^time_omp_synchronization_simulation[[:space:]]/ {print $2;
      exit}'
    cast: float
  env:
    path: 0*_bench/work/metadata/env-vars.out
    parser: cat
    cast: str
  hwloc:
    path: 0*_bench/work/metadata/hwloc-ls.out
    parser: cat
    cast: str
  logfile:
    path: 0*_bench/work/data/logfile_0
    parser: cat
    cast: str
  cpuinfo:
    path: 0*_bench/work/metadata/cpuinfo.out
    parser: cat
    cast: str
  cpu_model:
    path: 0*_bench/work/metadata/cpuinfo.out
    parser: 'grep "^model name\s" | cut -f2 -d: | head -n1'
    cast: strip
  time_simulate:
    path: 0*_bench/work/data/logfile_0
    parser: grep "^time_simulate_cpu " | cut -f2 -d" "
    cast: float
  label:
    path: 0*_bench/work/metadata/env-vars.out
    parser: grep "^BENCHMARK_ID=" | cut -f2 -d=
    cast: strip
current_set:
  setid: 7cb6ab5bed8f71be7a0e044e1435ec20
